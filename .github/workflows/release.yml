name: Draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching package.json (for example v2.3.0)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: genesis-release
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const version=JSON.parse(readFileSync("package.json")).version; if (!/^v\d+\.\d+\.\d+(-rc\.\d+)?$/.test(process.env.RELEASE_TAG) || process.env.RELEASE_TAG !== `v${version}`) process.exit(1)'
      - run: npm run check
      - run: npm test
      - name: Package and checksum
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ./make-zip.sh "$RUNNER_TEMP/genesis-kit-$RELEASE_TAG.zip"
          cd "$RUNNER_TEMP"
          sha256sum "genesis-kit-$RELEASE_TAG.zip" > "genesis-kit-$RELEASE_TAG.zip.sha256"
      - name: Create draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/genesis-kit-$RELEASE_TAG.zip" "$RUNNER_TEMP/genesis-kit-$RELEASE_TAG.zip.sha256" --target "$GITHUB_SHA" --draft --title "Genesis $RELEASE_TAG" --notes-file CHANGELOG.md
